<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>7000</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16142B">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="7000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" id="manifest">
<style>
  :root{
    --bar:#17152D; --in:#27243F; --out1:#C9D6FF; --out2:#AFC0FF; --out-text:#0E1747;
    --field:#26233C; --accent:#7C6CF0; --accent2:#5B4BDB; --text:#F1F0FA; --muted:#8F8CAD; --line:#ffffff14;
    --fs:19px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{height:100%;overflow:hidden;color:var(--text);background:#0E0C1F;overscroll-behavior:none;
    font-family:"Google Sans","Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;height:100dvh;
    background:
      radial-gradient(120% 60% at 100% 0%,#3A2D8F55 0%,transparent 60%),
      radial-gradient(100% 60% at 0% 100%,#1B5E9A40 0%,transparent 60%),
      linear-gradient(180deg,#120F29 0%,#0E0C1F 100%);}
  #app::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g fill='none' stroke='%23ffffff' stroke-opacity='.045' stroke-width='1.6'><rect x='14' y='18' width='30' height='20' rx='5'/><circle cx='22' cy='42' r='3'/><circle cx='36' cy='42' r='3'/><path d='M70 80l8-8 8 8-8 8z'/><circle cx='98' cy='30' r='6'/><path d='M20 92h22M20 100h14'/></g></svg>");
    background-size:120px 120px}
 
  /* Header */
  header{position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:4px;
    background:#17152DE6;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px 2px;border-bottom:1px solid var(--line);min-height:64px}
  .ib{width:46px;height:46px;border:0;background:none;color:#EDEBFF;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s}
  .ib:active{background:#ffffff22}
  .ib svg{width:25px;height:25px;fill:currentColor}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#6B66A8,#46427A);display:grid;place-items:center;flex:none;
    font-weight:700;font-size:13px;color:#fff;letter-spacing:.2px}
  .who{flex:1;min-width:0;margin-left:8px}
  .who b{display:block;font-size:20px;font-weight:700;color:#fff;line-height:1.15}
  .who small{display:block;font-size:12px;color:#6F6C93;line-height:1.25}
 
  #menuPop{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:10;background:#2B2848;border:1px solid var(--line);
    border-radius:16px;min-width:210px;padding:6px;box-shadow:0 12px 32px #0009;display:none}
  #menuPop.show{display:block;animation:pop .15s ease-out}
  #menuPop button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);font:inherit;font-size:17px;padding:14px 14px;border-radius:12px}
  #menuPop button:active{background:#ffffff1c}
 
  /* Messages */
  #msgs{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 10px;display:flex;flex-direction:column;gap:2px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  #msgs::-webkit-scrollbar{display:none}
  .day{align-self:center;font-size:13px;color:#B9B6D8;margin:14px 0 8px;padding:5px 14px;background:#ffffff12;border-radius:14px}
  .row{display:flex;flex-direction:column;max-width:86%;margin-top:2px}
  .row.in{align-self:flex-start;align-items:flex-start}
  .row.out{align-self:flex-end;align-items:flex-end}
  .b{padding:13px 18px;font-size:var(--fs);line-height:1.4;word-wrap:break-word;white-space:pre-line;animation:pop .2s ease-out;
    -webkit-user-select:text;user-select:text;touch-action:manipulation}
  .in .b{background:var(--in);color:var(--text);border-radius:5px 24px 24px 24px;box-shadow:0 1px 0 #ffffff0d inset}
  .out .b{background:linear-gradient(160deg,var(--out1),var(--out2));color:var(--out-text);border-radius:24px 5px 24px 24px;font-weight:500}
  .b u{text-underline-offset:4px;text-decoration-thickness:1.5px}
  .demo{display:block;margin-top:6px;font-size:9px;line-height:1.2;color:#6F6C90;letter-spacing:.1px}
  .meta{font-size:12px;color:var(--muted);margin:4px 8px 8px;display:flex;align-items:center;gap:4px}
  .meta svg{width:16px;height:16px;fill:#8FA3FF}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
 
  .typing{align-self:flex-start;background:var(--in);border-radius:5px 24px 24px 24px;padding:16px 20px;display:flex;gap:6px;margin-top:4px}
  .typing i{width:8px;height:8px;border-radius:50%;background:#9996BD;animation:bl 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
 
  /* Composer */
  footer{position:relative;z-index:3;flex:none;background:#17152DE6;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;align-items:flex-end;gap:10px}
  .field{flex:1;min-width:0;display:flex;align-items:center;gap:0;background:var(--field);border-radius:28px;min-height:56px;padding:0 6px;border:1px solid #ffffff10;transition:border-color .2s}
  .field:focus-within{border-color:#7C6CF080}
  .fb{width:42px;height:42px;border:0;background:none;color:#D9D6F2;border-radius:50%;display:grid;place-items:center;flex:none;cursor:pointer}
  .fb:active{background:#ffffff22}
  .fb svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .send .ic-arrow{display:none}
  .send.has .ic-arrow{display:block}
  .send.has .ic-wave{display:none}
  .field input{flex:1;width:100%;min-width:0;text-overflow:ellipsis;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:19px;padding:14px 6px;letter-spacing:.3px}
  .field input::placeholder{color:#8481A6;letter-spacing:0}
  .send{width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;
    cursor:pointer;flex:none;transition:transform .12s,opacity .2s,box-shadow .2s;box-shadow:0 4px 14px #5B4BDB66}
  .send:active{transform:scale(.91)}
  .send:disabled{opacity:.5}
  .send svg{width:26px;height:26px;fill:currentColor}
 
  #fab{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:4;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:#2B2848F0;color:#ddd;display:none;place-items:center;box-shadow:0 4px 12px #0006}
  #fab.show{display:grid}
  #fab svg{width:24px;height:24px;fill:currentColor}
  #toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translateX(-50%);z-index:11;background:#3A3660;color:#fff;
    padding:11px 18px;border-radius:20px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
  #toast.show{opacity:1}
  html,body,#app{max-width:100vw;overflow-x:hidden}
  footer{gap:8px}
  .send{flex:none}
  @media (max-width:430px){
    footer{padding-left:8px;padding-right:8px;gap:8px}
    .field{padding:0 4px;min-height:54px}
    .fb{width:36px;height:36px}
    .fb svg{width:24px;height:24px}
    .field input{font-size:18px;padding:14px 4px}
    .send{width:54px;height:54px}
    .row{max-width:90%}
  }
  @media (max-width:360px){
    .fb{width:32px;height:32px}
    .field input{font-size:16.5px}
    .send{width:50px;height:50px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (min-width:600px){#app{max-width:480px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" aria-label="Înapoi"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
    <div class="avatar">7000</div>
    <div class="who"><b>7000</b></div>
    <button class="ib" aria-label="Apel"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg></button>
    <button class="ib" id="menu" aria-label="Meniu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </header>
  <div id="menuPop"><button id="clear">Resetare conversație</button><button id="full">Ecran complet</button></div>
 
  <main id="msgs" aria-live="polite"></main>
  <button id="fab" aria-label="Jos"><svg viewBox="0 0 24 24"><path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8z"/></svg></button>
  <div id="toast"></div>
 
  <footer>
    <div class="field">
      <button class="fb" id="bPlus" aria-label="Adaugă"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button>
      <input id="inp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" autocorrect="off" spellcheck="false"
             enterkeyhint="send" placeholder="Introduceţi numărul de bord..." aria-label="Număr de bord">
      <button class="fb" id="bEmoji" aria-label="Emoji"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14c.9 1.3 2.1 2 3.5 2s2.6-.7 3.5-2"/><circle cx="9" cy="10" r=".6" fill="currentColor"/><circle cx="15" cy="10" r=".6" fill="currentColor"/></svg></button>
      <button class="fb" id="bImg" aria-label="Imagine"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9.5" r="1.4"/><path d="M5 17l4.5-4.5 3 3 2.5-2.5L19 17"/></svg></button>
    </div>
    <button class="send" id="send" aria-label="Trimite"><svg class="ic-arrow" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg><svg class="ic-wave" viewBox="0 0 24 24"><path d="M5 10h2v4H5zM9 7h2v10H9zM13 4h2v16h-2zM17 9h2v6h-2z" transform="translate(-1 0)"/></svg></button>
  </footer>
</div>
 
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var msgs=$('msgs'),inp=$('inp'),sendBtn=$('send'),fab=$('fab'),toast=$('toast'),pop=$('menuPop');
  var KEY='sms7000.v3';
  var state={items:[],used:{}};
  var p2=function(n){return (n<10?'0':'')+n};
  var fmtDate=function(d){return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()};
  var fmtTime=function(d){return p2(d.getHours())+':'+p2(d.getMinutes())};
  var months=['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
  var esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};
  var tick='<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
 
  function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.items)state=s;}catch(e){}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function ticketNo(){var n;do{n=String(Math.floor(10000000+Math.random()*90000000));}while(state.used[n]);state.used[n]=1;return n;}
  function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
 
  function ticketHtml(t){
    return 'Bilet electronic\nnr. <u>'+t.no+'</u>\nData <u>'+t.date+'</u>\nora <u>'+t.time+'</u>\nValabil 1 ora\nPret 7 MDL\nNumar de bord\n'+esc(t.bord);
  }
  var DEMO='<span class="demo">Simulation · no real value</span>';
 
  function render(){
    msgs.innerHTML='';var last='';
    var today=fmtDate(new Date());
    state.items.forEach(function(m){
      var d=new Date(m.ts),ds=fmtDate(d);
      if(ds!==last){
        var e=document.createElement('div');e.className='day';
        var y=new Date();y.setDate(y.getDate()-1);
        e.textContent=ds===today?'Astăzi':ds===fmtDate(y)?'Ieri':d.getDate()+' '+months[d.getMonth()];
        msgs.appendChild(e);last=ds;
      }
      appendMsg(m);
    });
  }
  function appendMsg(m){
    var r=document.createElement('div');r.className='row '+m.type;
    var body=m.ticket?ticketHtml(m.ticket):esc(m.text);
    r.innerHTML='<div class="b">'+body+(m.ticket?DEMO:'')+'</div><div class="meta">'+m.time+(m.type==='out'?tick:'')+'</div>';
    msgs.appendChild(r);
  }
  function scroll(smooth){msgs.style.scrollBehavior=smooth===false?'auto':'smooth';msgs.scrollTop=msgs.scrollHeight;}
  function push(m){state.items.push(m);save();appendMsg(m);}
 
  function seed(){
    var now=new Date();
    [{b:6,h:8,m:12,v:'1016'},{b:6,h:17,m:41,v:'2406'},{b:3,h:7,m:58,v:'1029'},{b:1,h:17,m:17,v:'2408'}].forEach(function(it){
      var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-it.b,it.h,it.m),t=fmtTime(d);
      state.items.push({type:'out',text:it.v,time:t,ts:d.getTime()});
      state.items.push({type:'in',text:'Solicitarea este in curs de procesare.',time:t,ts:d.getTime()});
      state.items.push({type:'in',time:t,ts:d.getTime(),ticket:{no:ticketNo(),date:fmtDate(d),time:t,bord:it.v}});
    });
    save();
  }
 
  function typing(){var t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';msgs.appendChild(t);scroll();return t;}
  function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(function(){toast.classList.remove('show')},1800);}
 
  var busy=false;
  function send(){
    var v=inp.value.replace(/\D/g,'');
    if(busy)return;
    if(v.length!==4){notify('Introduceți 4 cifre');buzz(40);inp.focus();return;}
    busy=true;sendBtn.disabled=true;
    var now=new Date();
    push({type:'out',text:v,time:fmtTime(now),ts:now.getTime()});
    inp.value='';syncSend();scroll();inp.focus({preventScroll:true});
    var ty=typing();
    setTimeout(function(){
      ty.remove();
      var d1=new Date();
      push({type:'in',text:'Solicitarea este in curs de procesare.',time:fmtTime(d1),ts:d1.getTime()});
      scroll();
      var ty2=typing();
      setTimeout(function(){
        ty2.remove();
        var d=new Date(),t=fmtTime(d);
        push({type:'in',time:t,ts:d.getTime(),ticket:{no:ticketNo(),date:fmtDate(d),time:t,bord:v}});
        save();scroll();busy=false;sendBtn.disabled=false;buzz(60);
      },1500);
    },800);
  }
 
  sendBtn.addEventListener('click',send);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();send();}});
  function setPh(){inp.placeholder=window.innerWidth<=430?'Număr de bord...':'Introduceţi numărul de bord...'}
  setPh();window.addEventListener('resize',setPh);
  function syncSend(){sendBtn.classList.toggle('has',inp.value.length>0)}
  inp.addEventListener('input',function(){inp.value=inp.value.replace(/\D/g,'').slice(0,4);syncSend()});
  ['bPlus','bEmoji','bImg'].forEach(function(id){$(id).addEventListener('click',function(){notify('Indisponibil');inp.focus({preventScroll:true})})});
  msgs.addEventListener('scroll',function(){fab.classList.toggle('show',msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight>180);});
  fab.addEventListener('click',function(){scroll()});
 
  /* menu */
  $('menu').addEventListener('click',function(e){e.stopPropagation();pop.classList.toggle('show');});
  document.addEventListener('click',function(){pop.classList.remove('show')});
  $('clear').addEventListener('click',function(){state={items:[],used:{}};seed();render();scroll(false);notify('Conversație resetată');});
  function goFull(){var el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;
    if(rq){try{var p=rq.call(el,{navigationUI:'hide'});if(p&&p.catch)p.catch(function(){});}catch(e){}}}
  $('full').addEventListener('click',goFull);
 
  /* keyboard-safe viewport */
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',function(){$('app').style.height=window.visualViewport.height+'px';scroll(false);});
  }
  window.addEventListener('resize',function(){scroll(false)});
  window.addEventListener('orientationchange',function(){setTimeout(function(){scroll(false)},300)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)scroll(false)});
  document.addEventListener('gesturestart',function(e){e.preventDefault()});
  var lastTouch=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-lastTouch<300&&e.target.tagName!=='INPUT')e.preventDefault();lastTouch=n;},{passive:false});
 
  /* first tap → fullscreen when opened in a browser */
  var standalone=matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(!standalone){var once=function(){goFull();document.removeEventListener('click',once)};document.addEventListener('click',once);}
 
  /* inline PWA manifest + icons */
  try{
    var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#17152D"/><circle cx="256" cy="256" r="190" fill="#6C5CE7"/><text x="256" y="292" font-family="Arial" font-size="110" font-weight="700" fill="#fff" text-anchor="middle">7000</text></svg>';
    var icon='data:image/svg+xml;base64,'+btoa(svg);
    var man={name:'7000',short_name:'7000',display:'fullscreen',display_override:['fullscreen','standalone'],orientation:'portrait',
      background_color:'#0E0C1F',theme_color:'#17152D',start_url:'.',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};
    $('manifest').href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
    var l=document.createElement('link');l.rel='apple-touch-icon';l.href=icon;document.head.appendChild(l);
  }catch(e){}
 
  load();
  if(!state.items.length)seed();
  render();scroll(false);
})();
</script>
</body>
</html>
