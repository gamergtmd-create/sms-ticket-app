<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messages - 7000</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0e11;
            color: #e3e2e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Контейнер смартфона */
        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
            background-color: #121318;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        @media (min-width: 420px) {
            .phone-container {
                height: 92vh;
                border-radius: 28px;
                border: 2px solid #2d2f36;
            }
        }

        /* Верхняя панель управления (Header) */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #121318;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #c4c6d0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 50%;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: #33353d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c4c6d0;
        }

        .contact-number {
            font-size: 20px;
            font-weight: 400;
            color: #e3e2e6;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Область переписки */
        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        /* Стили сообщений */
        .message-row {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .message-row.sent {
            align-items: flex-end;
        }

        .message-row.received {
            align-items: flex-start;
        }

        .bubble {
            max-width: 82%;
            padding: 14px 16px;
            font-size: 22px;
            line-height: 1.35;
            word-wrap: break-word;
            white-space: pre-line;
            border-radius: 20px;
        }

        .bubble.sent {
            background-color: #a8c7fa;
            color: #042e6f;
            border-bottom-right-radius: 4px;
            font-size: 24px;
        }

        .bubble.received {
            background-color: #282a2f;
            color: #e3e2e6;
            border-top-left-radius: 4px;
        }

        /* Форматирование подчёркнутого текста билета */
        .underline-text {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* Индикатор ожидания (Typing indicator) */
        .typing-indicator {
            display: none;
            background-color: #282a2f;
            padding: 12px 18px;
            border-radius: 18px;
            width: fit-content;
            margin-bottom: 8px;
        }

        .typing-dots {
            display: flex;
            gap: 5px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background-color: #a8c7fa;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Нижняя панель ввода */
        .input-bar {
            padding: 10px 12px 16px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #121318;
        }

        .input-wrapper {
            flex: 1;
            background-color: #1e1f25;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 4px 16px;
            min-height: 52px;
        }

        .sim-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #c4c6d0;
            font-size: 15px;
            font-weight: 500;
            margin-right: 8px;
            cursor: pointer;
            user-select: none;
        }

        .text-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #e3e2e6;
            font-size: 17px;
        }

        .text-input::placeholder {
            color: #8e9099;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #c4c6d0;
        }

        .action-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #473d63;
            border: none;
            color: #d0bcff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        /* Скрытие скроллбара */
        .chat-body::-webkit-scrollbar {
            width: 4px;
        }
        .chat-body::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- Шапка чата -->
    <header class="chat-header">
        <div class="header-left">
            <button class="icon-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </button>
            <div class="avatar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <span class="contact-number">7000</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
            </button>
            <button class="icon-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Поле сообщений -->
    <main class="chat-body" id="chatBody">
        <!-- Сообщения будут появляться здесь -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </main>

    <!-- Нижний бар ввода -->
    <footer class="input-bar">
        <div class="input-wrapper">
            <div class="sim-tag">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 6h-2V7h2v2zm-4 0h-2V7h2v2zm-4 0H7V7h2v2zm8 4h-2v-2h2v2zm-4 0h-2v-2h2v2zm-4 0H7v-2h2v2zm8 4h-2v-2h2v2zm-4 0h-2v-2h2v2zm-4 0H7v-2h2v2z"/>
                </svg>
                <span>2 Orange</span>
            </div>
            <input type="text" class="text-input" id="messageInput" placeholder="Код борта (напр. 2312)" autocomplete="off">
            <div class="input-actions">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="cursor:pointer">
                    <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
                </svg>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="cursor:pointer">
                    <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                </svg>
            </div>
        </div>
        <button class="action-btn" id="actionBtn">
            <!-- Иконка микрофона по умолчанию -->
            <svg id="micIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
            </svg>
            <!-- Иконка отправки -->
            <svg id="sendIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </footer>
</div>

<script>
    const chatBody = document.getElementById('chatBody');
    const messageInput = document.getElementById('messageInput');
    const actionBtn = document.getElementById('actionBtn');
    const micIcon = document.getElementById('micIcon');
    const sendIcon = document.getElementById('sendIcon');
    const typingIndicator = document.getElementById('typingIndicator');

    // Переключение иконки Микрофон / Отправить
    messageInput.addEventListener('input', () => {
        if (messageInput.value.trim().length > 0) {
            micIcon.style.display = 'none';
            sendIcon.style.display = 'block';
        } else {
            micIcon.style.display = 'block';
            sendIcon.style.display = 'none';
        }
    });

    // Обработка отправки по Enter
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // Обработка клика на кнопку
    actionBtn.addEventListener('click', () => {
        if (messageInput.value.trim().length > 0) {
            sendMessage();
        }
    });

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        // 1. Отрисовка отправленного сообщения
        appendMessage(text, 'sent');
        messageInput.value = '';
        micIcon.style.display = 'block';
        sendIcon.style.display = 'none';

        // 2. Показать индикатор печати
        showTyping();

        // 3. Первое сообщение через 900мс
        setTimeout(() => {
            hideTyping();
            appendMessage('Solicitarea este in curs de procesare.', 'received');
            
            // Снова показать индикатор печати для билета
            showTyping();

            // 4. Второе сообщение (Билет) через 1.5 сек
            setTimeout(() => {
                hideTyping();
                const ticketText = generateTicketText(text);
                appendMessage(ticketText, 'received', true);
            }, 1500);

        }, 900);
    }

    function appendMessage(text, side, isHTML = false) {
        const row = document.createElement('div');
        row.className = `message-row ${side}`;

        const bubble = document.createElement('div');
        bubble.className = `bubble ${side}`;

        if (isHTML) {
            bubble.innerHTML = text;
        } else {
            bubble.textContent = text;
        }

        row.appendChild(bubble);
        
        // Вставляем перед индикатором печати
        chatBody.insertBefore(row, typingIndicator);
        scrollToBottom();
    }

    function showTyping() {
        typingIndicator.style.display = 'block';
        scrollToBottom();
    }

    function hideTyping() {
        typingIndicator.style.display = 'none';
    }

    function scrollToBottom() {
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    // Генерация электронного билета
    function generateTicketText(boardNumber) {
        const now = new Date();
        
        // Форматирование даты ДД.ММ.ГГГГ
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        const dateStr = `${day}.${month}.${year}`;

        // Форматирование времени ЧЧ:ММ
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const timeStr = `${hours}:${minutes}`;

        // Генерация случайного номера билета (4 случайные цифры после номера борта)
        const randomSuffix = Math.floor(1000 + Math.random() * 9000);
        const ticketNumber = `${boardNumber}${randomSuffix}`;

        return `Bilet electronic nr. <span class="underline-text">${ticketNumber}</span>
Data <span class="underline-text">${dateStr}</span>
ora <span class="underline-text">${timeStr}</span>
Valabil 1 ora
Pret 7 MDL
Numar de bord
${boardNumber}`;
    }
</script>
</body>
</html>
