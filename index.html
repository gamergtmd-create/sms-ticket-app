<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7000 - SMS Ticketing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Header / AppBar */
        .chat-header {
            background-color: #1f1f1f;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #2c2c2c;
            height: 56px;
            flex-shrink: 0;
        }
        .back-arrow {
            font-size: 20px;
            margin-right: 16px;
            color: #fff;
            cursor: pointer;
        }
        .contact-info {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }
        .avatar {
            width: 36px;
            height: 36px;
            background-color: #424242;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            color: #fff;
            font-weight: bold;
        }
        .contact-name {
            font-size: 16px;
            font-weight: 500;
            color: #fff;
        }
        .header-actions {
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }

        /* Chat Body / Messages */
        .chat-body {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #121212;
        }
        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-line;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .message.incoming {
            background-color: #262626;
            color: #f1f1f1;
            align-self: flex-start;
            border-top-left-radius: 4px;
        }
        .message.outgoing {
            background-color: #8c9eff;
            color: #000;
            align-self: flex-end;
            border-top-right-radius: 4px;
            font-weight: 400;
        }

        /* Footer / Input area */
        .chat-footer {
            background-color: #1f1f1f;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            border-top: 1px solid #2c2c2c;
        }
        .input-wrapper {
            flex-grow: 1;
            background-color: #2c2c2c;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            height: 48px;
        }
        .input-wrapper input {
            width: 100%;
            background: none;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .input-wrapper input::placeholder {
            color: #888;
        }
        .send-btn {
            background-color: #8c9eff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            cursor: pointer;
            flex-shrink: 0;
        }
        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transform: translateX(1px);
        }
    </style>
</head>
<body>

    <div class="chat-header">
        <div class="back-arrow">←</div>
        <div class="contact-info">
            <div class="avatar">👤</div>
            <div class="contact-name">7000</div>
        </div>
        <div class="header-actions">⋮</div>
    </div>

    <div class="chat-body" id="chatBody">
        <div class="message incoming">Solicitarea este in curs de procesare.</div>
        <div class="message incoming">Bilet electronic<br>nr. 10169051<br>Data 27.10.2026<br>ora 08:12<br>Valabil 1 ora<br>Pret 7 MDL<br>Numar de bord<br>1016</div>
    </div>

    <div class="chat-footer">
        <div class="input-wrapper">
            <input type="text" id="boardInput" placeholder="Introduceţi numărul de bord..." maxlength="4">
        </div>
        <button class="send-btn" id="sendBtn">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </div>

    <script>
        const chatBody = document.getElementById('chatBody');
        const boardInput = document.getElementById('boardInput');
        const sendBtn = document.getElementById('sendBtn');

        function scrollToBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function handleSend() {
            const text = boardInput.value.trim();
            if (!text) return;

            // 1. Добавляем исходящее сообщение (номер борта, отправленный пользователем)
            const outMsg = document.createElement('div');
            outMsg.className = 'message outgoing';
            outMsg.textContent = text;
            chatBody.appendChild(outMsg);
            
            boardInput.value = '';
            scrollToBottom();

            // 2. Симуляция ответа от сервиса 7000
            setTimeout(() => {
                const processingMsg = document.createElement('div');
                processingMsg.className = 'message incoming';
                processingMsg.textContent = "Solicitarea este in curs de procesare.";
                chatBody.appendChild(processingMsg);
                scrollToBottom();

                // 3. Генерация готового билета через 1.5 секунды
                setTimeout(() => {
                    const now = new Date();
                    const day = String(now.getDate()).padStart(2, '0');
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const year = now.getFullYear();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    
                    const randomTicketNum = Math.floor(10000000 + Math.random() * 90000000);

                    const ticketMsg = document.createElement('div');
                    ticketMsg.className = 'message incoming';
                    ticketMsg.innerHTML = `Bilet electronic<br>nr. ${randomTicketNum}<br>Data ${day}.${month}.${year}<br>ora ${hours}:${minutes}<br>Valabil 1 ora<br>Pret 7 MDL<br>Numar de bord<br>${text}`;
                    
                    chatBody.appendChild(ticketMsg);
                    scrollToBottom();
                }, 1500);

            }, 800);
        }

        sendBtn.addEventListener('click', handleSend);
        boardInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSend();
            }
        });

        scrollToBottom();
    </script>
</body>
</html>
