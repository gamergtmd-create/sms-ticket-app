<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>7000</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F1F1F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="7000">
<link rel="manifest" id="manifest">
<style>
  :root{
    --bg:#121212; --bar:#1F1F1F; --in:#262626; --out:#C4D1FF; --out-text:#0F1B4D;
    --field:#2C2C2C; --accent:#6C5CE7; --text:#E8E8E8; --muted:#9A9A9A; --line:#2E2E2E;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:"Google Sans","Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
    overscroll-behavior:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;height:100dvh;background:var(--bg)}

  /* App bar */
  header{flex:none;display:flex;align-items:center;gap:6px;background:var(--bar);
    padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px 4px;border-bottom:1px solid var(--line);min-height:60px}
  .ib{width:44px;height:44px;border:0;background:none;color:#E8E8E8;border-radius:50%;
    display:grid;place-items:center;cursor:pointer;flex:none}
  .ib:active{background:#ffffff1a}
  .ib svg{width:24px;height:24px;fill:currentColor}
  .avatar{width:40px;height:40px;border-radius:50%;background:#5A5A5A;display:grid;place-items:center;flex:none}
  .avatar svg{width:24px;height:24px;fill:#D9D9D9}
  .who{flex:1;min-width:0;margin-left:6px}
  .who b{display:block;font-size:19px;font-weight:700;color:#fff;line-height:1.15}
  .who small{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}

  /* Messages */
  #msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 8px;display:flex;flex-direction:column;
    gap:3px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
  .day{align-self:center;font-size:12px;color:var(--muted);margin:10px 0 6px;padding:3px 10px}
  .row{display:flex;flex-direction:column;max-width:82%}
  .row.in{align-self:flex-start;align-items:flex-start}
  .row.out{align-self:flex-end;align-items:flex-end}
  .b{padding:12px 16px;font-size:17px;line-height:1.38;word-wrap:break-word;white-space:pre-line;
    animation:pop .18s ease-out}
  .in .b{background:var(--in);color:var(--text);border-radius:4px 22px 22px 22px}
  .out .b{background:var(--out);color:var(--out-text);border-radius:22px 4px 22px 22px}
  .b u{text-underline-offset:3px}
  .demo{display:block;margin-top:8px;font-size:11.5px;color:var(--muted);letter-spacing:.2px}
  .time{font-size:11.5px;color:var(--muted);margin:3px 8px 8px}
  .row + .row .b{margin-top:0}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

  .typing{align-self:flex-start;background:var(--in);border-radius:4px 22px 22px 22px;padding:14px 18px;display:flex;gap:5px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#8a8a8a;animation:bl 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}

  /* Composer */
  footer{flex:none;background:var(--bar);border-top:1px solid var(--line);
    padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;align-items:flex-end;gap:8px}
  .field{flex:1;display:flex;align-items:center;gap:2px;background:var(--field);border-radius:26px;min-height:52px;padding:0 6px}
  .field input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:18px;padding:12px 6px}
  .field input::placeholder{color:#8e8e8e}
  .send{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;
    cursor:pointer;flex:none;transition:transform .12s,opacity .2s}
  .send:active{transform:scale(.92)}
  .send:disabled{opacity:.45}
  .send svg{width:24px;height:24px;fill:currentColor}

  #fab{position:absolute;right:14px;bottom:84px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:#2a2a2ae6;color:#ddd;display:none;place-items:center}
  #fab.show{display:grid}
  #fab svg{width:22px;height:22px;fill:currentColor}

  #toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#333;color:#fff;padding:9px 16px;
    border-radius:18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
  #toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" aria-label="Înapoi"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
    <div class="avatar"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
    <div class="who"><b>7000</b><small>simulare pentru prezentare</small></div>
    <button class="ib" aria-label="Apel"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg></button>
    <button class="ib" id="menu" aria-label="Meniu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </header>

  <main id="msgs" aria-live="polite"></main>

  <button id="fab" aria-label="Jos"><svg viewBox="0 0 24 24"><path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8z"/></svg></button>
  <div id="toast"></div>

  <footer>
    <div class="field">
      <input id="inp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"
             enterkeyhint="send" placeholder="Introduceţi numărul de bord..." aria-label="Număr de bord">
    </div>
    <button class="send" id="send" aria-label="Trimite"><svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></button>
  </footer>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var msgs=$('msgs'),inp=$('inp'),sendBtn=$('send'),fab=$('fab'),toast=$('toast');
  var used={};
  var p2=function(n){return (n<10?'0':'')+n};
  var fmtDate=function(d){return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()};
  var fmtTime=function(d){return p2(d.getHours())+':'+p2(d.getMinutes())};
  var months=['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];

  function ticketNo(){
    var n;
    do{ n=String(Math.floor(10000000+Math.random()*90000000)); }while(used[n]);
    used[n]=1; return n;
  }

  function scroll(smooth){
    msgs.style.scrollBehavior=smooth===false?'auto':'smooth';
    msgs.scrollTop=msgs.scrollHeight;
  }
  function day(label){
    var e=document.createElement('div');e.className='day';e.textContent=label;msgs.appendChild(e);
  }
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

  function add(type,html,time,extra){
    var r=document.createElement('div');r.className='row '+type;
    r.innerHTML='<div class="b">'+html+(extra||'')+'</div><div class="time">'+time+'</div>';
    msgs.appendChild(r);return r;
  }

  function ticketHtml(no,date,time,bord){
    return 'Bilet electronic\nnr. <u>'+no+'</u>\n Data <u>'+date+'</u>\n ora <u>'+time+'</u>\n Valabil 1 ora\n Pret 7 MDL\n Numar de bord\n '+esc(bord);
  }
  var DEMO='<span class="demo">Simulare · fără valoare reală</span>';

  /* ---------- history ---------- */
  function seed(){
    var now=new Date();
    var items=[
      {back:6,h:8,m:12,bord:'1016'},
      {back:6,h:17,m:41,bord:'2406'},
      {back:3,h:7,m:58,bord:'1029'},
      {back:1,h:17,m:17,bord:'2408'}
    ];
    var last='';
    items.forEach(function(it){
      var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-it.back,it.h,it.m);
      var lbl=d.getDate()+' '+months[d.getMonth()];
      if(lbl!==last){day(lbl);last=lbl;}
      var t=fmtTime(d);
      add('out',esc(it.bord),t);
      add('in','Solicitarea este in curs de procesare.',t);
      add('in',ticketHtml(ticketNo(),fmtDate(d),t,it.bord),t,DEMO);
    });
    day('Astăzi');
  }

  /* ---------- send flow ---------- */
  var busy=false;
  function typing(){
    var t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';
    msgs.appendChild(t);scroll();return t;
  }
  function notify(msg){
    toast.textContent=msg;toast.classList.add('show');
    clearTimeout(notify.t);notify.t=setTimeout(function(){toast.classList.remove('show')},1800);
  }

  function send(){
    var v=inp.value.replace(/\D/g,'');
    if(busy)return;
    if(v.length!==4){notify('Introduceți 4 cifre');if(navigator.vibrate)navigator.vibrate(40);inp.focus();return;}
    busy=true;sendBtn.disabled=true;
    var now=new Date(),t=fmtTime(now);
    add('out',esc(v),t);
    inp.value='';scroll();
    inp.focus({preventScroll:true});

    var ty=typing();
    setTimeout(function(){
      ty.remove();
      add('in','Solicitarea este in curs de procesare.',fmtTime(new Date()));
      scroll();
      var ty2=typing();
      setTimeout(function(){
        ty2.remove();
        var d=new Date();
        add('in',ticketHtml(ticketNo(),fmtDate(d),fmtTime(d),v),fmtTime(d),DEMO);
        scroll();busy=false;sendBtn.disabled=false;
        if(navigator.vibrate)navigator.vibrate(60);
      },1500);
    },800);
  }

  sendBtn.addEventListener('click',send);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();send();}});
  inp.addEventListener('input',function(){inp.value=inp.value.replace(/\D/g,'').slice(0,4)});

  /* scroll-down button */
  msgs.addEventListener('scroll',function(){
    var far=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight>160;
    fab.classList.toggle('show',far);
  });
  fab.addEventListener('click',function(){scroll()});
  $('menu').addEventListener('click',function(){notify('Simulare — fără meniu')});

  /* keyboard / viewport: keep last message visible */
  if(window.visualViewport){
    var fix=function(){
      $('app').style.height=window.visualViewport.height+'px';
      scroll(false);
    };
    window.visualViewport.addEventListener('resize',fix);
  }
  window.addEventListener('resize',function(){scroll(false)});

  /* fullscreen on first tap (when opened in browser) */
  var standalone=window.matchMedia('(display-mode: fullscreen)').matches||
                 window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(!standalone){
    var goFull=function(){
      var el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;
      if(rq){try{var p=rq.call(el,{navigationUI:'hide'});if(p&&p.catch)p.catch(function(){});}catch(e){}}
      document.removeEventListener('click',goFull);
    };
    document.addEventListener('click',goFull,{once:false});
  }

  /* inline PWA manifest + icon */
  try{
    var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#1F1F1F"/><circle cx="256" cy="256" r="190" fill="#6C5CE7"/><text x="256" y="292" font-family="Arial" font-size="110" font-weight="700" fill="#fff" text-anchor="middle">7000</text></svg>';
    var icon='data:image/svg+xml;base64,'+btoa(svg);
    var man={name:'7000',short_name:'7000',display:'fullscreen',display_override:['fullscreen','standalone'],
      orientation:'portrait',background_color:'#121212',theme_color:'#1F1F1F',start_url:'.',
      icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};
    $('manifest').href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
    var l=document.createElement('link');l.rel='apple-touch-icon';l.href=icon;document.head.appendChild(l);
  }catch(e){}

  seed();
  scroll(false);
})();
</script>
</body>
</html>
